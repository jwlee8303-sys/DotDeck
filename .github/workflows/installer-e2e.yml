# Installs, updates and uninstalls two test builds on a disposable Windows runner (build/test-installer.ps1).
# Runs on pull requests that touch the app, installer or packaging, and on demand (e.g. for a release tag).
name: Installer E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - 'Directory.*.props'
      - 'dotnet-tools.json'
      - '.github/workflows/installer-e2e.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to test (default: the selected branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: installer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_A: '1.5.901'
      VERSION_B: '1.5.902'
      WORK: 'C:\dotdeck-e2e'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package test versions A and B
        shell: pwsh
        run: |
          ./build/package.ps1 -Version $env:VERSION_A -PreviousFeed none -OutputDir publish/e2e/a
          ./build/package.ps1 -Version $env:VERSION_B -PreviousFeed publish/e2e/a/releases -OutputDir publish/e2e/b
          New-Item -ItemType Directory -Force "$env:WORK\A", "$env:WORK\B", "$env:WORK\legacy" | Out-Null
          Copy-Item publish/e2e/a/releases/DotDeck-Setup.exe "$env:WORK\A\"
          Copy-Item publish/e2e/b/releases/DotDeck-Setup.exe "$env:WORK\B\"
          Copy-Item publish/e2e/a/releases -Recurse "$env:WORK\feedA"
          Copy-Item publish/e2e/b/releases -Recurse "$env:WORK\feedB"
          Get-ChildItem publish/e2e/a/app -Filter 'DotDeck*.dll' | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Get the 1.5.0 per-user setup (existing users)
        shell: pwsh
        run: |
          gh release download v1.5.0 --repo $env:GITHUB_REPOSITORY --pattern DotDeck-Setup.exe --dir "$env:WORK\legacy"
          # DotDeck 1.5.0's DotDeck-Setup.exe embeds Velopack's per-user Setup.exe as a resource.
          powershell.exe -NoProfile -Command "`$a = [Reflection.Assembly]::LoadFile('$env:WORK\legacy\DotDeck-Setup.exe'); `$s = `$a.GetManifestResourceStream('Setup.exe'); `$f = [IO.File]::Create('$env:WORK\legacy\Setup.exe'); `$s.CopyTo(`$f); `$f.Close()"
          if (-not (Test-Path "$env:WORK\legacy\Setup.exe")) { throw 'Setup.exe not extracted' }

      - name: Install / update / uninstall
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/test-installer.ps1 -Work $env:WORK -VersionA $env:VERSION_A -VersionB $env:VERSION_B
          if ($LASTEXITCODE -ne 0) { throw "installer checks failed ($LASTEXITCODE)" }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:WORK\e2e-results.md") { Get-Content -Raw "$env:WORK\e2e-results.md" >> $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-e2e
          path: |
            C:\dotdeck-e2e\*.md
            C:\dotdeck-e2e\*.json
            C:\dotdeck-e2e\*.log
            C:\dotdeck-e2e\*.txt
            C:\dotdeck-e2e\jobs\*.log
          if-no-files-found: warn
